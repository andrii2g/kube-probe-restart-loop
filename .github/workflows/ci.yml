name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -timeout 60s
      - run: go build ./cmd/kube-probe-restart-loop
      - run: go run ./cmd/kube-probe-restart-loop compare examples/slow-start.yaml --out artifacts/slow-start
      - uses: actions/upload-artifact@v4
        with:
          name: slow-start-${{ matrix.os }}
          path: artifacts/slow-start/
