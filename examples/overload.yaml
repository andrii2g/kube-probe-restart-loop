name: Temporary overload
duration: 120s
application:
  startupDuration: 5s
  windows:
    - from: 40s
      to: 60s
      clock: scenario
      state: overloaded
      canServe: false
      responses:
        readiness: {success: false}
variants:
  - name: readiness-withdrawal
    probes:
      startup: {periodSeconds: 1, failureThreshold: 10}
      liveness: {periodSeconds: 5}
      readiness: {periodSeconds: 5, failureThreshold: 1}
